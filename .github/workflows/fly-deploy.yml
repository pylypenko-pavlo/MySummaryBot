name: Fly Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - name: Check for Save Bot build access
        id: save_bot
        env:
          SAVE_BOT_READ_TOKEN: ${{ secrets.SAVE_BOT_READ_TOKEN }}
        run: |
          if [ -n "$SAVE_BOT_READ_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the private Save Bot worker
        if: steps.save_bot.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: Theslamone/rvvrb-save-bot
          ref: 20afe0e9c5a46ed7784671caa72fc7dbed90622e
          path: MySummaryBot/SaveBotWorker/source
          token: ${{ secrets.SAVE_BOT_READ_TOKEN }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        working-directory: MySummaryBot
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Ensure machine is running
        working-directory: MySummaryBot
        run: |
          # Worker machine (no [http_service]) is left stopped after deploy and
          # nothing wakes it, so start every machine of the app explicitly.
          for id in $(flyctl machine list --json | jq -r '.[].id'); do
            flyctl machine start "$id" || true
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
